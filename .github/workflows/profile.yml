name: Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/terminal.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0e7c66&color_dots=#ebedf0,#c6e9df,#7fd3bb,#3fc6a4,#0e7c66
            dist/snake-dark.svg?palette=github-dark&color_snake=#3fc6a4&color_dots=#161b22,#173229,#1f5c4b,#2c9278,#3fc6a4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
