name: Profile

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/terminal.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
      - run: cp -r profile-3d-contrib dist/
      - name: Refresh Habr articles
        continue-on-error: true
        run: |
          node scripts/articles.mjs
          if ! git diff --quiet -- README.md README.ru.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update Habr articles"
            git push
          fi
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
